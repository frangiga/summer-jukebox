<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Retro</title>
  <style>
    :root {
      --primary-color: #ff6600; /* Naranja principal */
      --bg-dark: #1a1a1a;
      --jukebox-body: #2a2a2a;
      --jukebox-border: #ff6600;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 102, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Contenedor principal de la Jukebox */
    .jukebox-container {
      width: 360px;
      background: var(--jukebox-body);
      border: 4px solid var(--jukebox-border);
      border-radius: 180px 180px 20px 20px;
      padding: 30px 20px 25px 20px;
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.3),
                  inset 0 0 15px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Cabecera integrada: Año + Botonera de Control */
    .jukebox-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      margin-bottom: 20px;
      gap: 12px;
    }

    .jukebox-year {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 3px;
      color: var(--primary-color);
      text-shadow: 0 0 8px rgba(255, 102, 0, 0.6);
      text-align: center;
    }

    /* Controles de reproducción integrados */
    .jukebox-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    .control-btn {
      background: #111111;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    .control-btn:hover {
      background: var(--primary-color);
      color: #111111;
      box-shadow: 0 0 12px var(--primary-color);
      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    /* Cristal / Pantalla central centrado sin invadir bordes */
    .jukebox-glass-display {
      width: 88%;
      height: 220px;
      background: var(--glass-bg);
      border: 2px solid var(--glass-border);
      border-radius: 100px 100px 15px 15px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6),
                  0 0 10px rgba(255, 102, 0, 0.15);
      position: relative;
      overflow: hidden;
    }

    .glass-content {
      text-align: center;
      color: #e0e0e0;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Base inferior de adorno */
    .jukebox-speaker-grille {
      width: 88%;
      height: 50px;
      margin-top: 20px;
      background: repeating-linear-gradient(
        0deg,
        #111,
        #111 4px,
        var(--primary-color) 4px,
        var(--primary-color) 6px
      );
      border-radius: 8px;
      border: 1px solid rgba(255, 102, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="jukebox-container">
    
    <!-- Zona Superior Integrada (Año + Botones Centrados) -->
    <div class="jukebox-header">
      <div class="jukebox-year">1984</div>
      <div class="jukebox-controls">
        <button class="control-btn" title="Anterior">&#9198;</button>
        <button class="control-btn" title="Reproducir / Pausa">&#9654;</button>
        <button class="control-btn" title="Siguiente">&#9197;</button>
      </div>
    </div>

    <!-- Cristal Interior Centrado y con Espacio Respirable -->
    <div class="jukebox-glass-display">
      <div class="glass-content">
        <p>Selecciona una canción</p>
      </div>
    </div>

    <!-- Rejilla Inferior -->
    <div class="jukebox-speaker-grille"></div>

  </div>

</body>
</html>
